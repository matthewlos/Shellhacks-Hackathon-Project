<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Transistor Fix</title>
<meta name="description" content="Farm Hand relay fix: a PN2222 transistor lets the 3.3V ESP32 switch the 5V relay.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Atkinson+Hyperlegible+Next:wght@400;600;700&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9edf1;--panel:#fbfcfd;--ink:#0e1621;--ink2:#3d4a59;--muted:#5b6674;--line:rgba(14,22,33,.1);--ai:#1f64b8;--good:#1f9a3a;--warn:#b35a00;--stage:#dfe5eb}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1016;--panel:#141a22;--ink:#e8edf3;--ink2:#b3bdc9;--muted:#8b96a3;--line:rgba(255,255,255,.1);--ai:#5b9cf0;--good:#4cc24c;--warn:#f0a040;--stage:#1a212b}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Atkinson Hyperlegible Next",system-ui,sans-serif;padding:18px 16px 30px}
.w{max-width:1320px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px}
@media (max-width:980px){.w{grid-template-columns:1fr}}
h1{margin:0;font:800 1.7rem/1.1 "Bricolage Grotesque",sans-serif;grid-column:1/-1}
.steps{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
.steps button{border:1px solid var(--line);background:var(--panel);color:var(--ink2);font:700 14px "Atkinson Hyperlegible Next";padding:9px 14px;border-radius:99px;cursor:pointer}
.steps button.on{background:var(--ink);color:var(--bg)}
.stage{background:var(--stage);border-radius:16px;overflow:hidden}
svg{display:block;width:100%;height:auto}
.side{display:grid;gap:12px;align-content:start}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
.now{border:2px solid var(--ai)}
.k{font:700 12px "JetBrains Mono",monospace;color:var(--ai);letter-spacing:.06em;margin-bottom:6px}
.big{font:800 1.4rem/1.2 "Bricolage Grotesque";margin:2px 0 8px}
.p{color:var(--ink2)} .use{margin-top:8px;font-weight:700}
.al{color:var(--warn);font-weight:700;font-size:14px;margin-top:8px}
.nav{display:flex;justify-content:space-between;gap:8px;margin-top:12px}
.nav button{font:700 15px "Atkinson Hyperlegible Next";padding:10px 16px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
.nav button.go{background:var(--ai);color:#fff;border:0}
.draw{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw 1.2s cubic-bezier(.3,.7,.3,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.pulse{animation:pulse 1s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(1.7)}}
.fade{transition:opacity .4s}.dim{opacity:.18}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.draw{stroke-dashoffset:0}}
</style>
</head>
<body>
<div class="w">
  <h1>Relay fix: add a small transistor</h1>
  <div class="steps" id="steps"></div>
  <div class="stage"><svg id="svg" viewBox="0 0 1000 640" role="img" aria-label="Transistor wiring between the ESP32 and the relay"></svg></div>
  <div class="side">
    <div class="card now"><div class="k" id="k"></div><div class="big" id="h"></div><div class="p" id="p"></div><div class="use" id="use"></div><div class="al" id="al"></div>
      <div class="nav"><button id="back">← Back</button><button class="go" id="next">Next →</button></div></div>
    <div class="card"><div class="k">WHY</div><div class="p">Your relay wants 5V to switch, the ESP32 only gives 3.3V. The transistor is a tiny switch the ESP32 <b>can</b> flip, and it connects the relay's IN to ground with full strength. Relay jumper on <b>L</b>.</div></div>
  </div>
</div>
<script>
const NS = 'http://www.w3.org/2000/svg', svg = document.getElementById('svg');
const el = (t, a = {}, p = svg) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); p.appendChild(e); return e; };
const txt = (x, y, s, a = {}, p = svg) => { const t = el('text', {x, y, 'font-family': 'Arial', 'font-weight': 700, ...a}, p); t.textContent = s; return t; };
const g = id => el('g', {id, class: 'fade'});

// ---------- closeup of the PN2222 (what it looks like)
const ZC = g('close');
el('rect', {x: 20, y: 20, width: 300, height: 290, rx: 14, fill: '#fbfcfd', stroke: '#c8ced6'}, ZC);
txt(170, 50, 'PN2222 (in your kit, 5 of them)', {'text-anchor': 'middle', fill: '#0e1621', 'font-size': 15}, ZC);
el('path', {d: 'M 120 80 L 220 80 L 220 170 A 50 18 0 0 1 120 170 Z', fill: '#1d1d1f'}, ZC);     // black half-round body, flat face toward you
el('rect', {x: 120, y: 80, width: 100, height: 92, fill: '#262628'}, ZC);
txt(170, 120, 'PN', {'text-anchor': 'middle', fill: '#cfcfcf', 'font-size': 14}, ZC);
txt(170, 140, '2222', {'text-anchor': 'middle', fill: '#cfcfcf', 'font-size': 14}, ZC);
txt(170, 158, 'flat side', {'text-anchor': 'middle', fill: '#8a8a8a', 'font-size': 11}, ZC);
[['E', 135, '#1d1d1f', 'ground'], ['B', 170, '#1e7fe0', 'from ESP32'], ['C', 205, '#e08a1e', 'to relay IN']].forEach(([n, x, c, w]) => {
  el('rect', {x: x - 3, y: 182, width: 6, height: 80, fill: '#c9ccd0'}, ZC);
  el('circle', {cx: x, cy: 272, r: 13, fill: c}, ZC); txt(x, 277, n, {'text-anchor': 'middle', fill: '#fff', 'font-size': 14}, ZC);
});
txt(170, 300, 'E = ground · B = signal · C = relay', {'text-anchor': 'middle', fill: '#3d4a59', 'font-size': 12}, ZC);

// ---------- resistor closeup
const RC = g('rclose');
el('rect', {x: 20, y: 330, width: 300, height: 110, rx: 14, fill: '#fbfcfd', stroke: '#c8ced6'}, RC);
txt(170, 358, '1K resistor (brown-black-red)', {'text-anchor': 'middle', fill: '#0e1621', 'font-size': 15}, RC);
el('line', {x1: 50, x2: 290, y1: 395, y2: 395, stroke: '#c9ccd0', 'stroke-width': 4}, RC);
el('rect', {x: 120, y: 381, width: 100, height: 28, rx: 12, fill: '#d6bd8f'}, RC);
[['#6b3a1e', 138], ['#111', 156], ['#c8281e', 174], ['#c09a3c', 204]].forEach(([c, x]) => el('rect', {x, y: 381, width: 9, height: 28, fill: c}, RC));
txt(170, 430, 'the 4th band may be gold', {'text-anchor': 'middle', fill: '#5b6674', 'font-size': 12}, RC);

// ---------- breadboard strip (columns 13-24, rows a-e) + ESP32 end + relay
const BX = 380, BY = 300, P = 30, C0 = BX + 30;
const col = n => C0 + (n - 13) * P, row = r => BY + 40 + 'edcba'.indexOf(r) * P;
const BB = g('bb');
el('rect', {x: BX, y: BY, width: 12 * P + 40, height: 190, rx: 8, fill: '#f3f2ec', stroke: '#c8c8c0'}, BB);
for (let n = 13; n <= 24; n++) { txt(col(n), BY + 22, n, {'text-anchor': 'middle', fill: '#777', 'font-size': 11}, BB);
  for (const r of 'edcba') el('rect', {x: col(n) - 5, y: row(r) - 5, width: 10, height: 10, rx: 1, fill: '#2b2b2b'}, BB); }
for (const r of 'edcba') txt(BX + 12, row(r) + 4, r, {'text-anchor': 'middle', fill: '#777', 'font-size': 11}, BB);
txt(BX + 6 * P + 20, BY + 185, 'breadboard (the 5 holes in one column are joined)', {'text-anchor': 'middle', fill: '#777', 'font-size': 11}, BB);
// ESP32 pins we use
const ES = g('esp');
el('rect', {x: 360, y: 30, width: 260, height: 110, rx: 10, fill: '#17191d'}, ES);
txt(490, 58, 'ESP32', {'text-anchor': 'middle', fill: '#e8e8e4', 'font-size': 16}, ES);
const EP = {GND: [440, 110], D26: [560, 110]};
Object.entries(EP).forEach(([n, [x, y]]) => { el('circle', {cx: x, cy: y, r: 9, fill: '#d9b35c'}, ES); txt(x, y - 16, n === 'GND' ? 'GND (left, 2nd pin)' : 'D26', {'text-anchor': 'middle', fill: '#e8e8e4', 'font-size': 12}, ES); });
// relay
const RE = g('relay');
el('rect', {x: 820, y: 60, width: 160, height: 230, rx: 10, fill: '#c62828'}, RE);
el('rect', {x: 832, y: 90, width: 44, height: 150, rx: 4, fill: '#2f6fd6'}, RE);
const RS = {'DC+': [854, 115], 'DC−': [854, 165], 'IN': [854, 215]};
Object.entries(RS).forEach(([n, [x, y]]) => { el('circle', {cx: x, cy: y, r: 13, fill: '#d7dce0', stroke: '#888'}, RE); txt(x + 26, y + 5, n, {fill: '#fff', 'font-size': 14}, RE); });
txt(900, 80, 'relay', {'text-anchor': 'middle', fill: '#fff', 'font-size': 14}, RE);
el('rect', {x: 880, y: 262, width: 60, height: 18, rx: 3, fill: '#222'}, RE);
[-20, 0, 20].forEach(dx => el('circle', {cx: 910 + dx, cy: 271, r: 3, fill: '#d9b35c'}, RE));
const cap = el('rect', {x: 887, y: 260, width: 26, height: 22, rx: 3, fill: '#0b0b0b', stroke: '#ffd23f', 'stroke-width': 3}, RE);
txt(872, 276, 'L', {'text-anchor': 'end', fill: '#fff', 'font-size': 14}, RE); txt(948, 276, 'H', {fill: '#fff', 'font-size': 14}, RE);
txt(900, 305, 'wires 1 + 2 stay: VIN→DC+, GND→DC−', {'text-anchor': 'middle', fill: 'var(--ink2)', 'font-size': 11}, RE);
el('path', {d: 'M 854 115 C 760 115, 700 20, 620 20', fill: 'none', stroke: '#d63a31', 'stroke-width': 6, opacity: .35}, RE);
el('path', {d: 'M 854 165 C 760 165, 700 10, 600 10', fill: 'none', stroke: '#222', 'stroke-width': 6, opacity: .35}, RE);

// ---------- parts placed on the board (drawn per step)
const LAY = el('g', {id: 'lay'}), FX = el('g', {id: 'fx'});
function transistorOn(p) { el('path', {d: `M ${col(20) - 12} ${row('e') - 30} L ${col(22) + 12} ${row('e') - 30} L ${col(22) + 12} ${row('e') - 12} L ${col(20) - 12} ${row('e') - 12} Z`, fill: '#1d1d1f'}, p);
  txt(col(21), row('e') - 17, 'flat side → you', {'text-anchor': 'middle', fill: '#ddd', 'font-size': 9}, p);
  [20, 21, 22].forEach(n => el('line', {x1: col(n), x2: col(n), y1: row('e') - 12, y2: row('e'), stroke: '#c9ccd0', 'stroke-width': 4}, p));
  [['E', 20], ['B', 21], ['C', 22]].forEach(([l, n]) => txt(col(n), row('e') - 36, l, {'text-anchor': 'middle', fill: 'var(--ink)', 'font-size': 13}, p)); }
function resistorOn(p) { el('line', {x1: col(15), x2: col(21), y1: row('d'), y2: row('d'), stroke: '#c9ccd0', 'stroke-width': 4}, p);
  el('rect', {x: col(17) - 4, y: row('d') - 10, width: col(19) - col(17) + 8, height: 20, rx: 9, fill: '#d6bd8f'}, p);
  [['#6b3a1e', 0], ['#111', 1], ['#c8281e', 2]].forEach(([c, i]) => el('rect', {x: col(17) + 6 + i * 10, y: row('d') - 10, width: 6, height: 20, fill: c}, p)); }
function wire(a, b, c, bend, animate, p) { const d = `M ${a[0]} ${a[1]} C ${a[0]} ${a[1] + bend}, ${b[0]} ${b[1] - bend}, ${b[0]} ${b[1]}`;
  const w = el('path', {d, fill: 'none', stroke: c, 'stroke-width': 7, 'stroke-linecap': 'round'}, p);
  if (animate) { w.style.setProperty('--len', w.getTotalLength()); w.classList.add('draw'); } }
const ring = ([x, y]) => el('circle', {cx: x, cy: y, r: 14, fill: 'none', stroke: '#ffd23f', 'stroke-width': 4, class: 'pulse'}, FX);

const S = [
  {h: 'Find the transistor', p: 'Small black part with 3 metal legs and one flat side. Read the tiny print on the flat side. Also grab one 1K resistor: bands brown, black, red.', show: ['close', 'rclose'], use: 'From the kit: 1 transistor + 1 resistor', al: 'Print says PN2222 → legs are E-B-C (like the drawing). Print says P2N2222A → it’s reversed, C-B-E: tell me before step 3.'},
  {h: 'Unplug the USB', p: 'Power off while you add parts.', show: ['esp', 'relay'], use: ''},
  {h: 'Transistor into the breadboard', p: 'Flat side facing you. Legs into row e, columns 20, 21, 22. Left leg = E, middle = B, right = C.', show: ['close', 'bb'], parts: ['t'], ring: [[col(20), row('e')], [col(21), row('e')], [col(22), row('e')]], use: 'The PN2222'},
  {h: 'Resistor: column 15 → 21', p: 'One leg in hole d15, the other in hole d21 (same column as the middle leg B). Direction doesn’t matter.', show: ['rclose', 'bb'], parts: ['t', 'r'], ring: [[col(15), row('d')], [col(21), row('d')]], use: 'The 1K resistor'},
  {h: 'ESP32 D26 → hole a15', p: 'Pull the old wire 3 all the way out (off D26 and out of the IN screw). New F-M wire: hole end on D26, pin end into hole a15.', show: ['esp', 'bb'], parts: ['t', 'r'], wires: [[EP.D26, [col(15), row('a')], '#1e7fe0', 80]], ring: [EP.D26, [col(15), row('a')]], use: '1 F-M wire'},
  {h: 'ESP32 GND → hole a20', p: 'New F-M wire. Hole end on the ESP32’s LEFT GND pin (2nd pin on the 3V3 side). Pin end into hole a20 (under leg E).', show: ['esp', 'bb'], parts: ['t', 'r'], wires: [[EP.GND, [col(20), row('a')], '#222', 110]], ring: [EP.GND, [col(20), row('a')]], use: '1 F-M wire'},
  {h: 'Hole a22 → relay IN', p: 'Male-male wire: one end in hole a22 (under leg C), other end screwed into IN.', show: ['bb', 'relay'], parts: ['t', 'r'], wires: [[[col(22), row('a')], RS.IN, '#e08a1e', 70]], ring: [[col(22), row('a')], RS.IN], use: '1 male-male wire (loose bundle)'},
  {h: 'Relay jumper → L', p: 'Black cap onto the middle pin + the L pin. With the transistor, L is the right setting.', show: ['relay'], cap: true, ring: [[900, 271]], use: 'Just move the cap'},
  {h: 'Plug in + listen', p: 'USB back in. The test code already flips D26 every 2 s: you should hear a click every 2 s and see LED1 blink.', show: ['esp', 'bb', 'relay'], parts: ['t', 'r'], all: true, use: '', al: 'Still nothing? Send me a photo of the breadboard from straight above.'},
];
let cur = 0; try { cur = +localStorage.getItem('tr_step') || 0; } catch (e) {}
const stepsEl = document.getElementById('steps');
S.forEach((x, i) => { const b = document.createElement('button'); b.textContent = (i + 1) + ' · ' + x.h.split(' ').slice(0, 3).join(' '); b.onclick = () => { cur = i; render(); }; stepsEl.appendChild(b); });
function render() {
  try { localStorage.setItem('tr_step', cur); } catch (e) {}
  const x = S[cur];
  [...stepsEl.children].forEach((b, i) => b.classList.toggle('on', i === cur));
  document.getElementById('k').textContent = `STEP ${cur + 1} OF ${S.length}`;
  document.getElementById('h').textContent = x.h; document.getElementById('p').textContent = x.p;
  document.getElementById('use').textContent = x.use ? '🔌 ' + x.use : ''; document.getElementById('al').textContent = x.al ? '⚠ ' + x.al : '';
  ['close', 'rclose', 'bb', 'esp', 'relay'].forEach(id => document.getElementById(id).classList.toggle('dim', !x.show.includes(id)));
  LAY.innerHTML = ''; FX.innerHTML = '';
  if ((x.parts || []).includes('t')) transistorOn(LAY);
  if ((x.parts || []).includes('r')) resistorOn(LAY);
  // wires from earlier steps stay (faded), this step's wires draw
  S.slice(0, cur).forEach(y => (y.wires || []).forEach(([a, b, c, bend]) => { const t = el('g', {opacity: x.all ? 1 : .35}, LAY); wire(a, b, c, bend, false, t); }));
  (x.wires || []).forEach(([a, b, c, bend]) => wire(a, b, c, bend, true, LAY));
  (x.ring || []).forEach(ring);
  cap.setAttribute('x', cur >= 7 ? 887 : 907);
  document.getElementById('back').disabled = cur === 0; document.getElementById('next').textContent = cur === S.length - 1 ? 'Done ✓' : 'Next →';
}
document.getElementById('next').onclick = () => { if (cur < S.length - 1) { cur++; render(); } };
document.getElementById('back').onclick = () => { if (cur > 0) { cur--; render(); } };
addEventListener('keydown', e => { if (e.key === 'ArrowRight') document.getElementById('next').click(); if (e.key === 'ArrowLeft') document.getElementById('back').click(); });
render();
</script>
</body>
</html>
