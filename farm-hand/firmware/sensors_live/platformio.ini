; PlatformIO Project Configuration File
;
; Farm Hand sensor test: both soil probes, both DS18B20s, live on the OLED and over serial.
; Same layout as firmware/oled_temp_display (Daniel's). Pumps stay off.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 115200

lib_deps = 
    adafruit/Adafruit GFX Library
    adafruit/Adafruit SSD1306
    paulstoffregen/OneWire
    milesburton/DallasTemperature
