; PlatformIO Project Configuration File
;
; Farm Hand sensor test: both soil probes, both DS18B20s, live on the OLED and over serial.
; Same layout as firmware/oled_temp_display (Daniel's). Pumps stay off.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 115200
board_build.partitions = huge_app.csv   ; Bluetooth + WiFi need more than the default 1.3 MB app space
build_flags = -I include -DCORE_DEBUG_LEVEL=4   ; include/secrets.h for comp_wifi; 4 = WiFi login debug log

lib_deps = 
    adafruit/Adafruit GFX Library
    adafruit/Adafruit SSD1306
    paulstoffregen/OneWire
    milesburton/DallasTemperature
