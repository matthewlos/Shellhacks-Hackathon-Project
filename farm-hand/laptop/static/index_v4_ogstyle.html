<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prompt Grass</title>
<meta name="description" content="AI irrigation for Florida's drought: two soil containers, a Gemini agent team, and a timer to beat.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='none' stroke='%233987e5' stroke-width='2' d='M12 2.5c3.4 4.2 6 7.3 6 10.7a6 6 0 1 1-12 0c0-3.4 2.6-6.5 6-10.7z'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1"></script>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
               "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
<style>
/* Dechante house style (visual-page tokens): blue = the AI pot / the agents, orange = the timer pot.
   Layout idea borrowed from the HackMIT PromptGrass app: the 3D model is the page, everything else floats on it. */
:root{
  --ground:#0a0e13; --surface:#131a22; --surface-2:#19222c; --glass:rgba(19,26,34,.74); --line:rgba(237,242,247,.11);
  --ink:#edf2f7; --ink-2:#b3bec9; --muted:#8c98a5;
  --bt:#3987e5; --bt-wash:rgba(57,135,229,.16); --live:#d95926; --live-wash:rgba(217,89,38,.16);
  --good:#0ca30c; --bad:#d03b3b; --warn:#fab219; --water:#7cc8ff;
  --f-display:"Bricolage Grotesque","Atkinson Hyperlegible Next",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible Next","Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--ground);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;text-align:inherit}
button:disabled{cursor:progress;opacity:.55}
button:focus-visible,input:focus-visible{outline:2px solid var(--bt);outline-offset:2px}
.mono{font-family:var(--f-mono)}
.disp{font-family:var(--f-display);font-weight:700;letter-spacing:-.015em}

.app{position:fixed;inset:0;overflow:hidden}
.backdrop{position:absolute;inset:0;background:radial-gradient(1100px 620px at 50% 46%,#16212c,transparent 70%),radial-gradient(900px 500px at 50% 110%,rgba(57,135,229,.08),transparent 70%),var(--ground)}
.backdrop::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.5))}
#field{position:absolute;inset:0;width:100%;height:100%;display:block;outline:none;touch-action:none}
.overlay{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.anchor{position:absolute;left:0;top:0;pointer-events:auto;white-space:nowrap}

.panel{background:var(--glass);border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(20px) saturate(1.2);-webkit-backdrop-filter:blur(20px) saturate(1.2);box-shadow:0 24px 60px -20px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.05)}
.pill{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:999px;font:500 12px/1 var(--f-mono);background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(14px);color:var(--ink-2)}
.pill .ph{font-size:14px}
.pill.ok .ph{color:var(--good)} .pill.warn .ph{color:var(--warn)} .pill.ai .ph{color:var(--bt)}

.top{position:absolute;top:16px;left:20px;right:16px;display:flex;justify-content:space-between;align-items:center;gap:12px;z-index:5}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:10px;background:var(--bt-wash);color:var(--bt);display:grid;place-items:center}
.logo svg{width:19px;height:19px}
.brand .name{font-size:22px}
.brand .ctx{color:var(--muted);font-size:13px;padding-left:14px;margin-left:4px;border-left:1px solid var(--line)}
.pills{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}

.rail{position:absolute;left:16px;top:72px;display:grid;gap:10px;z-index:4}
.rail-group{display:grid;gap:2px;padding:5px;border-radius:14px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(18px)}
.rail-btn{width:64px;padding:9px 0 7px;border-radius:10px;display:grid;justify-items:center;gap:3px;color:var(--muted);font-size:11px;font-weight:600;transition:.2s}
.rail-btn .ph{font-size:18px}
.rail-btn:hover{color:var(--ink);background:rgba(255,255,255,.06)}
.rail-btn.on{color:var(--bt);background:var(--bt-wash)}

.ptag{display:flex;align-items:center;gap:10px;height:34px;padding:0 12px 0 4px;border-radius:999px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(14px);font:500 12px/1 var(--f-mono)}
.ptag b{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff}
.ptag .v{display:flex;align-items:center;gap:4px;color:var(--ink)} .ptag .v .ph{color:var(--muted)}
.ptag small{font:600 11px var(--f-body);color:var(--muted)}
.ftag{font:500 11px/1 var(--f-mono);color:var(--water);display:flex;align-items:center;gap:6px}
.ftag::before{content:'';width:26px;height:1px;background:var(--water)}

.agentline{position:absolute;left:50%;bottom:156px;transform:translateX(-50%);z-index:4;display:flex;align-items:center;gap:10px;height:36px;padding:0 14px;border-radius:999px;background:var(--bt-wash);border:1px solid rgba(57,135,229,.4);color:#9cc3f5;font:500 12px/1 var(--f-mono);backdrop-filter:blur(14px);transition:opacity .3s,transform .3s var(--ease)}
.agentline.idle{opacity:0;transform:translate(-50%,6px);pointer-events:none}
.spin{width:12px;height:12px;border-radius:50%;border:2px solid rgba(57,135,229,.3);border-top-color:var(--bt);animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.answers-wrap{position:absolute;left:100px;right:16px;bottom:18px;display:grid;justify-items:center;z-index:4;transition:right .4s var(--ease)}
.app.drawer-open .answers-wrap{right:424px}
.answers{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) auto;gap:1px;width:100%;max-width:1180px;border-radius:14px;overflow:hidden;background:var(--line);border:1px solid var(--line);box-shadow:0 30px 70px -24px rgba(0,0,0,.8)}
.ans{background:color-mix(in srgb,var(--surface) 94%,transparent);padding:16px 18px;display:grid;gap:4px;align-content:start;min-width:0}
.ans .q{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:13px}
.ans .q .ph{font-size:15px}
.ans .a{font:700 clamp(1.3rem,1.8vw,1.6rem)/1.15 var(--f-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ans .s{color:var(--ink-2);font-size:12.5px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.a.blue{color:#6aa8f0} .a.good{color:#35c235} .a.warn{color:var(--warn)} .a.bad{color:#ff7a7a}
.meter{height:5px;border-radius:9px;background:rgba(255,255,255,.08);overflow:hidden;margin:4px 0 2px}
.meter i{display:block;height:100%;border-radius:9px;background:var(--bt);transition:width .7s var(--ease)}
.duo{display:flex;align-items:center;gap:8px;font:500 12px var(--f-mono);color:var(--ink-2)}
.duo i{display:inline-block;width:9px;height:9px;border-radius:3px}
.run{background:var(--bt);display:grid;place-items:center;align-content:center;gap:6px;padding:0 28px;color:#fff;font-weight:700;font-size:14px;transition:filter .2s,transform .15s}
.run .ph{font-size:22px}
.run:hover:not(:disabled){filter:brightness(1.1)}
.run:active:not(:disabled){transform:scale(.98)}

.drawer{position:absolute;top:62px;right:16px;bottom:16px;width:392px;z-index:6;display:flex;flex-direction:column;overflow:hidden;animation:slide .32s var(--ease) both}
@keyframes slide{from{opacity:0;transform:translateX(16px)}}
.drawer header{display:flex;justify-content:space-between;align-items:center;padding:18px 18px 10px}
.drawer h2{margin:0;font-size:1.5rem;line-height:1.1}
.drawer .body{padding:4px 18px 18px;overflow-y:auto;overflow-x:hidden;display:grid;gap:14px;align-content:start}
.x{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:var(--muted)}
.card{background:var(--surface-2);border-radius:10px;padding:14px;display:grid;gap:10px}
.card-t{font-weight:700;font-size:13px;display:flex;align-items:center;gap:6px}
.lede{color:var(--ink-2);font-size:13.5px;margin:0}
.flow{display:grid;gap:6px}
.step{display:grid;grid-template-columns:32px 1fr;gap:10px;align-items:center;padding:7px 8px;border-radius:10px;transition:background .25s}
.step .ic{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:rgba(255,255,255,.06);color:var(--ink-2);font-size:16px;transition:.25s}
.step .n{font-weight:700;font-size:13.5px} .step .w{font:500 11px/1.3 var(--f-mono);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.step.on{background:var(--bt-wash)} .step.on .ic{background:var(--bt);color:#fff;box-shadow:0 0 14px rgba(57,135,229,.6)}
.step.bad .ic{background:var(--bad);color:#fff} .step.warn .ic{background:var(--warn);color:#241a00}
.par{margin-left:15px;padding-left:10px;border-left:2px dashed rgba(57,135,229,.35);display:grid;gap:4px}
.loopnote{font:500 11px var(--f-mono);color:#6aa8f0;padding-left:50px}
.trace{list-style:none;margin:0;padding:0;display:grid}
.trace li{display:grid;grid-template-columns:62px 76px minmax(0,1fr);overflow-wrap:anywhere;gap:8px;padding:7px 0;border-top:1px solid var(--line);font-size:12.5px}
.trace li:first-child{border-top:0}
.trace .t{font:500 11px/1.5 var(--f-mono);color:var(--muted)} .trace .a{font:600 11px/1.5 var(--f-mono);color:#6aa8f0}
.trace li.bad .a{color:#ff7a7a} .trace li.warn .a{color:var(--warn)} .trace li.good .a{color:#35c235}
.rules{list-style:none;margin:0;padding:0;display:grid;gap:7px}
.rules li{display:grid;grid-template-columns:18px 1fr;gap:2px 8px;align-items:center;font-size:13px}
.rules li small{grid-column:2}
.rules .ph{font-size:16px} .rules .ph-check-circle{color:var(--good)} .rules .ph-x-circle{color:var(--bad)}
.rules small{font:500 11px var(--f-mono);color:var(--muted)}
.kv{display:flex;justify-content:space-between;gap:12px;align-items:baseline;font-size:13.5px}
.kv span{color:var(--ink-2)} .kv b{font:600 13px var(--f-mono)}
.soak{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 0;border-top:1px solid var(--line)}
.soak:first-child{border-top:0}
.soak .big{font:700 1.15rem/1.2 var(--f-body)} .soak small{font:500 11px var(--f-mono);color:var(--muted)}
.ask{display:flex;gap:8px}
.ask input{flex:1;min-width:0;height:42px;border-radius:10px;border:1px solid var(--line);background:rgba(0,0,0,.28);padding:0 12px;font-size:14.5px;outline:none}
.ask input:focus{border-color:rgba(57,135,229,.6);box-shadow:0 0 0 3px rgba(57,135,229,.15)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:10px;font-weight:700;font-size:13.5px;transition:transform .15s,filter .2s;white-space:nowrap}
.btn:active:not(:disabled){transform:scale(.97)}
.btn-bt{background:var(--bt);color:#fff}
.btn-soft{background:rgba(255,255,255,.06);border:1px solid var(--line)}
.btn-bad{background:var(--bad-wash,rgba(208,59,59,.2));color:#ff9a9a}
.sugg{display:flex;flex-wrap:wrap;gap:6px}
.sugg button{font-size:12.5px;padding:6px 10px;border-radius:999px;border:1px solid var(--line);color:var(--ink-2)}
.sugg button:hover{color:var(--ink);background:rgba(255,255,255,.05)}
.reply{font-size:14.5px;line-height:1.55}
.spark{width:100%;height:120px;display:block}
.note{font-size:12px;color:var(--muted);border-left:2px solid var(--line);padding-left:8px}

@media (max-width:900px){
  .rail{top:auto;bottom:12px;left:50%;transform:translateX(-50%);display:flex}
  .rail-group{display:flex} .rail-btn{width:54px}
  .answers-wrap,.app.drawer-open .answers-wrap{left:10px;right:10px;bottom:84px}
  .answers{grid-template-columns:1fr 1fr} .run{grid-column:1/-1;padding:12px;display:flex;justify-content:center}
  .drawer{left:10px;right:10px;width:auto;top:56px;bottom:84px}
  .brand .ctx,.pills .pill:not(.keep){display:none}
  .agentline{bottom:340px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="backdrop"></div>
  <canvas id="field" tabindex="0" aria-label="3D view of the two soil containers"></canvas>
  <div class="overlay">
    <div class="anchor" id="tagA"><div class="ptag"><b style="background:var(--bt)">A</b><span class="v"><i class="ph ph-drop"></i><span id="tA">–</span></span><span class="v"><i class="ph ph-thermometer-simple"></i><span id="tTa">–</span></span><small>AI agents</small></div></div>
    <div class="anchor" id="tagB"><div class="ptag"><b style="background:var(--live)">B</b><span class="v"><i class="ph ph-drop"></i><span id="tB">–</span></span><span class="v"><i class="ph ph-thermometer-simple"></i><span id="tTb">–</span></span><small>fixed timer</small></div></div>
    <div class="anchor" id="frontTag" hidden><div class="ftag" id="frontTxt"></div></div>
  </div>

  <div class="top">
    <div class="brand">
      <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2.5c3.4 4.2 6 7.3 6 10.7a6 6 0 1 1-12 0c0-3.4 2.6-6.5 6-10.7z"/></svg></div>
      <span class="name disp">Prompt Grass</span>
      <span class="ctx">Florida drought test: AI vs a timer</span>
    </div>
    <div class="pills">
      <span class="pill keep" id="modePill"><i class="ph ph-plugs"></i><span id="mode">connecting</span></span>
      <span class="pill ai"><i class="ph ph-cpu"></i><span id="brainName">–</span></span>
      <span class="pill warn"><i class="ph ph-sun"></i><span id="drought">–</span></span>
    </div>
  </div>

  <nav class="rail" aria-label="Views">
    <div class="rail-group" role="group" aria-label="Lens">
      <button class="rail-btn on" data-lens="natural"><i class="ph ph-eye"></i>Natural</button>
      <button class="rail-btn" data-lens="moisture"><i class="ph ph-drop"></i>Moisture</button>
      <button class="rail-btn" data-lens="temp"><i class="ph ph-thermometer-simple"></i>Heat</button>
    </div>
    <div class="rail-group" role="group" aria-label="Panels">
      <button class="rail-btn" data-drawer="agents"><i class="ph ph-cpu"></i>Agents</button>
      <button class="rail-btn" data-drawer="pours"><i class="ph ph-waves"></i>Pours</button>
      <button class="rail-btn" data-drawer="history"><i class="ph ph-chart-line"></i>History</button>
      <button class="rail-btn" data-drawer="ask"><i class="ph ph-chat-circle-text"></i>Ask</button>
    </div>
  </nav>

  <div class="agentline idle" id="agentline" role="status" aria-live="polite"><span class="spin"></span><span id="agentTxt"></span></div>

  <div class="answers-wrap">
    <div class="answers">
      <div class="ans"><div class="q"><i class="ph ph-drop"></i>Does pot A need water?</div><div class="a" id="aWater">–</div><div class="s" id="sWater">Waiting for the first check</div></div>
      <div class="ans"><div class="q"><i class="ph ph-hourglass-medium"></i>When will it be dry?</div><div class="a" id="aDry">–</div><div class="meter"><i id="mDry" style="width:0"></i></div><div class="s" id="sDry">–</div></div>
      <div class="ans"><div class="q"><i class="ph ph-cloud-rain"></i>Is rain coming?</div><div class="a" id="aRain">–</div><div class="s" id="sRain">–</div></div>
      <div class="ans"><div class="q"><i class="ph ph-scales"></i>Water saved vs the timer</div><div class="a" id="aSaved">–</div><div class="duo"><i style="background:var(--bt)"></i><span id="mlA">–</span><i style="background:var(--live);margin-left:6px"></i><span id="mlB">–</span></div></div>
      <button class="run" id="runBtn"><i class="ph ph-play"></i><span>Run agents</span></button>
    </div>
  </div>

  <aside class="drawer panel" id="drawer" hidden aria-live="polite">
    <header><h2 class="disp" id="dTitle">Agents</h2><button class="x" id="dClose" aria-label="Close"><i class="ph ph-x"></i></button></header>
    <div class="body" id="dBody"></div>
  </aside>
</div>

<script>
const $ = id => document.getElementById(id);
const j = async (u, o) => (await fetch(u, o)).json();
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clock = ts => new Date(ts * 1000).toLocaleTimeString([], {hour:'numeric', minute:'2-digit', second:'2-digit'}).replace(/\s(?=[AP]M)/, ' ');
const NAMES = {weather_agent:'Weather', soil_agent:'Soil', memory_agent:'Memory', planner_agent:'Planner', critic_agent:'Critic', guards:'Safety rules', executor:'Pump', farm_helper:'Farm chat'};
window.LIVE = {busy:{}, soak:{}}; window.LENS = 'natural';
let S = null, drawer = null, lastAnswer = '';

document.querySelectorAll('[data-lens]').forEach(b => b.onclick = () => {
  document.querySelectorAll('[data-lens]').forEach(x => x.classList.toggle('on', x === b)); window.LENS = b.dataset.lens; });
document.querySelectorAll('[data-drawer]').forEach(b => b.onclick = () => openDrawer(drawer === b.dataset.drawer ? null : b.dataset.drawer));
$('dClose').onclick = () => openDrawer(null);
function openDrawer(name) {
  drawer = name;
  document.querySelectorAll('[data-drawer]').forEach(x => x.classList.toggle('on', x.dataset.drawer === name));
  $('drawer').hidden = !name; $('app').classList.toggle('drawer-open', !!name);
  if (name) renderDrawer(true);
}

async function fast() {
  let L; try { L = await j('/api/live'); } catch (e) { return; }
  window.LIVE = L;
  $('tA').textContent = L.a != null ? L.a.toFixed(1) + '%' : '–';
  $('tB').textContent = L.b != null ? L.b.toFixed(1) + '%' : '–';
  const t = L.temp != null ? L.temp.toFixed(1) + '°' : '–'; $('tTa').textContent = t; $('tTb').textContent = t;
  const busy = Object.entries(L.busy || {}), line = $('agentline');
  if (L.pumping !== 'none') { line.classList.remove('idle'); $('agentTxt').textContent = `Pump ${L.pumping} is running`; }
  else if (busy.length) { const [k, w] = busy[busy.length - 1]; line.classList.remove('idle'); $('agentTxt').textContent = `${NAMES[k] || k}: ${w}`; }
  else if (L.soak?.phase === 'soaking') { line.classList.remove('idle'); $('agentTxt').textContent = `Water soaking into pot ${L.soak.pot}: ${L.soak.before?.toFixed(1)}% to ${L.soak.now?.toFixed(1)}%`; }
  else line.classList.add('idle');
  if (drawer === 'agents') paintFlow();
}

async function slow() {
  try { S = await j('/api/state'); } catch (e) { $('mode').textContent = 'server offline'; $('modePill').className = 'pill keep warn'; return; }
  $('mode').textContent = S.fake ? 'Test data' : S.online ? 'Board live' : 'Board offline';
  $('modePill').className = 'pill keep ' + (S.fake ? 'warn' : S.online ? 'ok' : 'warn');
  $('brainName').textContent = S.brain.startsWith('gemini') ? 'Gemini agent team' : 'Rule brain';
  const d = S.drought || {};
  $('drought').textContent = d.level ? `${(d.county || '').replace(' County', '')}: ${d.level} ${d.level_name}` : 'Drought data offline';

  const [dec, rep] = await Promise.all([j('/api/decisions'), j('/api/report')]);
  if (dec.length && !$('runBtn').disabled) {
    const x = dec[0], water = x.action === 'water';
    $('aWater').textContent = water ? `Watering ${(+x.seconds).toFixed(0)} s` : 'Not yet';
    $('aWater').className = 'a ' + (water ? 'blue' : 'good');
    $('sWater').textContent = x.sentence.replace(/^(WATER|WAIT):\s*/, '');
  }
  const p = S.prediction || {};
  if (p.settling) { $('aDry').textContent = 'Re-measuring'; $('aDry').className = 'a'; $('sDry').textContent = 'Soil just changed, so the drying rate is being measured again'; }
  else if (p.hours_until_dry != null) {
    $('aDry').textContent = p.hours_until_dry < .05 ? 'Dry now' : p.hours_until_dry >= 48 ? 'Over 2 days' : `In ${p.hours_until_dry.toFixed(1)} h`;

    const pumping = L.pumping === k;

      if (d.userData.v > 1) { d.userData.v = 0; d.userData.fall = pumping; }
      const t = d.userData.v; d.position.set(-.5 + Math.sin(t * 9 + d.id) * .06, H + .9 - t * .85, -.2 + Math.cos(t * 7 + d.id) * .06); });
  }
  if (ms - lastPaint > 90) { lastPaint = ms; const s = L.soak || {}; for (const k of ['A', 'B']) paint(pots[k], pots[k].shown, L.temp, s.pot === k ? s : null, lens, now); }
  const working = Object.keys(L.busy || {}).some(k => k !== 'farm_helper');
  glow += ((working ? 1 : 0) - glow) * Math.min(1, dt * 3);
  AG.intensity = glow * (3 + Math.sin(ms / 160));
  motes.forEach(m => { m.userData.a += dt * (.6 + glow); m.position.set(pots.A.x + Math.cos(m.userData.a) * m.userData.r, H + .4 + m.userData.y * 1.4 + Math.sin(ms / 700 + m.id) * .1, Math.sin(m.userData.a) * m.userData.r * .7); m.material.opacity = glow * .9; });
  if (!REDUCE && !touched) { const a = .42 + Math.sin(ms / 9000) * .28, r = Math.hypot(cam.position.x - controls.target.x, cam.position.z - controls.target.z); cam.position.x = controls.target.x + Math.sin(a) * r; cam.position.z = controls.target.z + Math.cos(a) * r; }
  controls.update(); renderer.render(scene, cam);
  place(tagA, new THREE.Vector3(pots.A.x + W * .18, H + 1.05, D * .05)); place(tagB, new THREE.Vector3(pots.B.x + W * .18, H + 1.05, D * .05));
  const fb = pots.A.frontCm != null ? pots.A : pots.B.frontCm != null ? pots.B : null;
  if (fb) { fTag.hidden = false; fTxt.textContent = `water front ${fb.frontCm.toFixed(1)} cm down`; place(fTag, new THREE.Vector3(fb.x + W / 2 + .1, H - fb.frontCm / DEPTH_CM * H, D / 2)); } else fTag.hidden = true;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
