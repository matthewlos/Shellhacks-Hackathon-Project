<style>
/* one theme for the whole deck: the dark house palette */
:root{
  color-scheme: dark;
  --ground:#0a0e13; --surface:#131a22; --surface-2:#19222c;
  --ink:#edf2f7; --ink-2:#b3bec9; --muted:#8c98a5; --axis:#38434f; --hair:rgba(237,242,247,.11);
  --bt:#3987e5; --live:#d95926; --live-wash:rgba(217,89,38,.20); --good-wash:rgba(12,163,12,.20);
  --f-display:"Bricolage Grotesque","Atkinson Hyperlegible Next",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Atkinson Hyperlegible Next","Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:var(--f-body);
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font:400 18px/1.45 var(--f-body);overflow:hidden;-webkit-font-smoothing:antialiased}
#viewport{position:fixed;inset:0;display:grid;place-items:center;overflow:hidden;cursor:pointer}
#stage{width:1280px;height:720px;position:relative;flex:none}
.slide{position:absolute;inset:0;display:none;grid-template-rows:auto minmax(0,1fr);gap:16px;padding:40px 64px 46px;background:var(--ground)}
.slide.on{display:grid}
.kick{margin:0 0 6px;font:500 12.5px/1.3 var(--f-mono);color:var(--muted)}
.slide h2{text-wrap:balance;margin:0;font:700 42px/1.06 var(--f-display);text-wrap:balance}
.sub{margin:8px 0 0;font:400 20px/1.35 var(--f-body);color:var(--ink-2)}
.art{min-height:0;position:relative}
.art svg{position:absolute;inset:0;display:block;width:100%;height:100%;overflow:visible}
.prog{position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--live);transform-origin:0 50%;transform:scaleX(0);opacity:.9;transition:transform .35s ease-out}

/* svg pieces: CDR slides */
.lk{fill:none;stroke:var(--axis);stroke-width:2.4;stroke-linecap:round}
.lk.hot{stroke:var(--ink-2)}
.hd{fill:var(--axis);stroke:none}
.bx{fill:var(--surface);stroke:var(--hair);stroke-width:1.5}
.bx.lit{stroke:var(--ink);stroke-width:2.2}
.bx.win{fill:var(--good-wash)}
.lab{fill:var(--ink);font:700 16px var(--f-body);text-anchor:middle}
.labl{fill:var(--ink);font:700 16px var(--f-body)}
.note{fill:var(--muted);font:12px var(--f-mono);text-anchor:middle}
.tag{fill:var(--muted);font:700 15px var(--f-mono)}
.pk{fill:var(--live);stroke:var(--ground);stroke-width:3;opacity:0}
.hub{fill:var(--surface);stroke:var(--ink);stroke-width:2.2}
.ring{fill:var(--live-wash);stroke:var(--live);stroke-width:2.2}
.mvp{fill:none;stroke:var(--live);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.mvpl{fill:var(--live);font:700 14px var(--f-mono);text-anchor:middle}
.bnd{fill:none;stroke:var(--axis);stroke-width:1.6}
.bndl{fill:var(--muted);font:600 11.5px var(--f-mono);}
.layl{fill:var(--muted);font:600 11.5px var(--f-mono);text-anchor:middle}
.gate{fill:var(--surface);stroke:var(--ink);stroke-width:2}
.anote{fill:var(--muted);font:11px var(--f-mono)}
/* svg type: feedback map slides */
.t-node{font:700 22px var(--f-body);text-anchor:middle;dominant-baseline:central}
.t-kick{font:700 19px var(--f-mono);fill:var(--bt)}
.t-card{font:700 30px var(--f-display);fill:var(--ink)}
.t-body{font:400 20px var(--f-body);fill:var(--ink-2)}
.t-row{font:700 22px var(--f-body);fill:var(--ink)}
.t-feat{font:700 20px var(--f-body);text-anchor:middle;dominant-baseline:central}
.t-vend{font:700 18.5px var(--f-body);fill:var(--ink);text-anchor:middle;dominant-baseline:central}
.t-ph{font:700 20px var(--f-body);fill:var(--ink)}
.t-pl{font:700 16px var(--f-mono);fill:var(--muted);}
.t-pv{font:400 20px var(--f-body);fill:var(--ink)}
.t-note{font:400 13px var(--f-mono);fill:var(--muted)}
.t-leg{font:400 18px var(--f-body);fill:var(--ink-2)}
.t-step{font:700 22.5px var(--f-body);fill:var(--ink)}
.t-num{font:600 20px var(--f-mono);fill:var(--ink);text-anchor:middle;dominant-baseline:central}
.t-sbody{font:400 19.5px var(--f-body);fill:var(--ink-2)}
.t-olab{font:700 16px var(--f-mono);fill:var(--muted);}
.t-otitle{font:700 21px var(--f-body)}
.t-ritem{font:700 21px var(--f-body);fill:var(--ink)}
.ico{fill:none;stroke:var(--ink);stroke-linecap:round;stroke-linejoin:round}
.g{transform-box:fill-box;transform-origin:center}

/* chrome */
#dots{position:fixed;left:0;right:0;bottom:calc(12px + env(safe-area-inset-bottom, 0px));display:flex;justify-content:center;gap:8px;z-index:20}
#dots button{width:9px;height:9px;padding:0;border-radius:50%;border:0;background:var(--axis);cursor:pointer}
#dots button[aria-current="true"]{background:var(--ink)}
#hud{position:fixed;right:14px;bottom:calc(8px + env(safe-area-inset-bottom, 0px));display:flex;gap:6px;align-items:center;z-index:20}
#hud button,#hud span{font:500 12px var(--f-mono);color:var(--muted);background:transparent;border:0;cursor:pointer;padding:4px 6px}
#hud button:hover{color:var(--ink)}
#help{position:fixed;left:14px;bottom:calc(10px + env(safe-area-inset-bottom, 0px));font:500 12px var(--f-mono);color:var(--muted);z-index:20}
button:focus-visible{outline:2px solid var(--bt);outline-offset:3px}
@media (max-width:600px){#help{display:none}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* intro chapter slides */
.chapters{display:flex;gap:6px;margin-top:12px}
.chapters span{font:500 11.5px var(--f-mono);color:var(--muted);padding:4px 9px;border-radius:999px;border:1px solid rgba(237,242,247,.1)}
.chapters span.now{color:var(--ink);background:var(--surface-2);border-color:var(--live)}
.x-big{font:700 34px var(--f-display);fill:var(--ink)}
.x-mid{font:700 24px var(--f-display);fill:var(--ink)}
.x-lab{font:700 20px var(--f-body);fill:var(--ink)}
.x-labc{font:700 20px var(--f-body);fill:var(--ink);text-anchor:middle}
.x-sm{font:400 17px var(--f-body);fill:var(--ink-2)}
.x-smc{font:400 17px var(--f-body);fill:var(--ink-2);text-anchor:middle}
.x-mono{font:500 15px var(--f-mono);fill:var(--muted);}
.x-monoc{font:500 15px var(--f-mono);fill:var(--muted);text-anchor:middle}
.x-pk-k{font:600 14px var(--f-mono);fill:var(--bt);}
.x-pline{font:400 22px var(--f-body);fill:var(--ink)}
.x-chip{font:600 15px var(--f-body);fill:var(--ink);text-anchor:middle;dominant-baseline:central}
/* owner 2026-09-16: no deck chrome, no kicker labels */
#dots,#hud,#help,.prog,.kick{display:none!important}
/* salesforce dropdowns */
.acc{position:absolute;inset:0;display:grid;grid-template-columns:280px 1fr;gap:48px;align-items:center}
.acc .logo{display:flex;flex-direction:column;align-items:center;gap:14px;padding-top:40px}
.acc .logo img{width:250px}
.acc .logo span{font:600 18px var(--f-body);color:var(--ink-2)}

<script>
/* your data. The real deck keeps slide text in DATA and images in IMG as base64 data URLs */
const DATA = {cdr: {pace: 0.8}, fm: {pace: 0.53}, intro: {pace: 0.8, meta: {showChapters: false, chapters: []}}};
const IMG = {};   /* e.g. {photo: "data:image/jpeg;base64,...", logo: "data:image/png;base64,..."} */
const CD = DATA.cdr, FM = DATA.fm, IN = DATA.intro;
const NS = "http://www.w3.org/2000/svg";
const $ = (q, r = document) => r.querySelector(q);
const K = {ground: "#0a0e13", surface: "#131a22", surface2: "#19222c", ink: "#edf2f7", ink2: "#b3bec9", muted: "#8c98a5",
  axis: "#38434f", bt: "#3987e5", live: "#d95926", pm: "#3987e5", sponsor: "#f0b429", other: "#a78bfa", ok: "#3fb96f", miss: "#e5534b"};
const HAIR = "rgba(237,242,247,.13)";
Object.assign(K, {btWash: "rgba(57,135,229,.14)", liveWash: "rgba(217,89,38,.16)", gold: "#f0b429"});
function h(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) { if (v == null) continue; if (k === "class") e.className = v; else e.setAttribute(k, v); }
  kids.flat().forEach((k) => k != null && e.append(k.nodeType ? k : document.createTextNode(String(k))));
  return e;
}
function s(tag, attrs = {}, ...kids) {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) if (v != null) e.setAttribute(k, v);
  kids.flat().forEach((k) => k != null && e.append(k));
  return e;
}
function tx(attrs, t) { const e = s("text", attrs); e.textContent = t; return e; }
function lines(x, y, arr, lh, attrs) { return arr.map((t, i) => tx({x, y: y + i * lh, ...attrs}, t)); }
function grp(...kids) { return s("g", {class: "g"}, ...kids); }
function ico(id, x, y, size, color) { return s("use", {href: `#i-${id}`, x, y, width: size, height: size, class: "ico", style: color ? `stroke:${color}` : null, "stroke-width": (1.85 * 24 / size).toFixed(2)}); }
const arrowHead = (x, y) => s("path", {class: "hd", d: `M${x},${y} l-10,-6.5 v13 z`});
function head(x1, y1, x2, y2, color, size = 11) {
  const a = Math.atan2(y2 - y1, x2 - x1) * 180 / Math.PI;
  return s("path", {d: `M0,0 L${-size},${-size * .55} L${-size},${size * .55} Z`, fill: color, transform: `translate(${x2},${y2}) rotate(${a})`});
}
function edge(svg, x1, y1, x2, y2, color, w, extra = {}) {
  const L = Math.hypot(x2 - x1, y2 - y1), ux = (x2 - x1) / L, uy = (y2 - y1) / L;
  const p = s("path", {d: `M${x1},${y1} L${(x2 - ux * 9).toFixed(1)},${(y2 - uy * 9).toFixed(1)}`, fill: "none", stroke: color, "stroke-width": w, "stroke-linecap": "round", ...extra});
  const hd = head(x1, y1, x2, y2, color);
  svg.append(p, hd);
  return {p, hd};
}
const diamond = (cx, cy, r, fill, stroke = K.ground) => s("path", {d: `M${cx},${cy - r} L${cx + r},${cy} L${cx},${cy + r} L${cx - r},${cy} Z`, fill, stroke, "stroke-width": 2.5});
const para = (x, y, w, hgt, skew, attrs) => s("path", {d: `M${x + skew},${y} L${x + w},${y} L${x + w - skew},${y + hgt} L${x},${y + hgt} Z`, ...attrs});
const card = (x, y, w, hgt, r = 16, fill = K.surface, stroke = HAIR, sw = 1.5) => s("rect", {x, y, width: w, height: hgt, rx: r, fill, stroke, "stroke-width": sw});
const fmDot = (svg, r = 8) => { const c = s("circle", {class: "pk", r, cx: 0, cy: 0, fill: K.live, stroke: K.ground, "stroke-width": 2.5}); svg.append(c); return c; };

/* ---------- click engine: one click = one step. Nothing plays on its own ---------- */
let PACE = 1;
const RMQ = matchMedia("(prefers-reduced-motion: reduce)");
let instant = false;
const still = () => instant || RMQ.matches || !Element.prototype.animate;
let pending = [];
function at(ms, fn) {
  if (still()) { fn(); return; }
  const job = {fn, due: performance.now() + ms * PACE};
  job.id = setTimeout(() => { pending = pending.filter((j) => j !== job); fn(); }, ms * PACE);
  pending.push(job);
}
/* a click mid-step first finishes that step instantly, so a fast click never leaves a piece hidden */
function flush() {
  const was = instant; instant = true;
  while (pending.length) {
    pending.sort((a, b) => a.due - b.due);
    const j = pending.shift(); clearTimeout(j.id); j.fn();
  }
  document.getAnimations().forEach((a) => a.cancel());
  instant = was;
}
const EASE = "cubic-bezier(.22,.8,.26,1)", SLOW = EASE;
function play(el, frames, opts) {
  if (still()) return null;
  const a = el.animate(frames, {...opts, duration: opts.duration * PACE, delay: (opts.delay || 0) * PACE});
  at((opts.delay || 0) + opts.duration + 80, () => a.cancel());
  return a;
}
function show(el, frames, dur = 800) { if (!el) return; el.style.opacity = ""; play(el, frames, {duration: dur, easing: EASE}); }
const POP = [{opacity: 0, transform: "scale(.6)"}, {opacity: 1, transform: "scale(1)"}];
const FADE = [{opacity: 0}, {opacity: 1}];
const RISE = [{opacity: 0, transform: "translateY(16px)"}, {opacity: 1, transform: "none"}];
const SLIDE_IN = [{opacity: 0, transform: "translateX(48px)"}, {opacity: 1, transform: "none"}];
function pulse(el, k = 1.08) { play(el, [{transform: "scale(1)"}, {transform: `scale(${k})`}, {transform: "scale(1)"}], {duration: 700, easing: "ease-in-out"}); }
function draw(path, dur) {
  path.style.opacity = "";
  if (still()) return;
  const L = path.getTotalLength();
  play(path, [{strokeDasharray: `${L} ${L}`, strokeDashoffset: L}, {strokeDasharray: `${L} ${L}`, strokeDashoffset: 0}], {duration: dur, easing: "ease-in-out"});
}
function drawEdge(e, dur = 900) { draw(e.p, dur); at(dur, () => show(e.hd, FADE, 250)); }
function travel(path, dot, dur, done, rev = false) {
  if (done) at(dur, done);
  if (still()) return;
  const L = path.getTotalLength(), N = 28, frames = [];
  for (let k = 0; k <= N; k++) {
    const q = path.getPointAtLength(L * (rev ? 1 - k / N : k / N));
    frames.push({transform: `translate(${q.x}px,${q.y}px)`, opacity: k === 0 || k === N ? 0 : 1, offset: k / N});
  }
  play(dot, frames, {duration: dur, easing: "ease-in-out"});
}
function frame(kick, title, svg, sub) {
  return h("section", {class: "slide"},
    h("div", {}, h("p", {class: "kick"}, kick), h("h2", {}, title), sub ? h("p", {class: "sub"}, sub) : null),
    h("div", {class: "art"}, svg), h("i", {class: "prog"}));
}
const SLIDES = [];
function addSlide({el, all, steps, pace, onReset}) {
  SLIDES.push({el, n: steps.length, pace,
    reset() { all.forEach((x) => { x.style.opacity = 0; x.style.transform = ""; }); onReset && onReset(); },
    step(k, fast) { const was = instant; instant = was || fast; PACE = pace; steps[k](); instant = was; }});
}

/* ---------- intro chapter helpers ---------- */
const rect = (x, y, w, hgt, r = 16, fill = K.surface, stroke = HAIR, sw = 1.5, extra = {}) => s("rect", {x, y, width: w, height: hgt, rx: r, fill, stroke, "stroke-width": sw, ...extra});
/* a path with an arrowhead at its end, aimed along the path's last direction */
function arrow(svg, d, color = K.ink2, w = 2.6, extra = {}) {
  const p = s("path", {d, fill: "none", stroke: color, "stroke-width": w, "stroke-linecap": "round", ...extra});
  svg.append(p);
  const hd = s("path", {fill: color});
  svg.append(hd);
  requestAnimationFrame(() => {
    const T = p.getTotalLength(), a = p.getPointAtLength(Math.max(0, T - 1)), b = p.getPointAtLength(T);
    const ang = Math.atan2(b.y - a.y, b.x - a.x) * 180 / Math.PI;
    hd.setAttribute("d", "M0,0 L-11,-6 L-11,6 Z");
    hd.setAttribute("transform", `translate(${b.x},${b.y}) rotate(${ang})`);
  });
  return {p, hd};
}
const dotOf = (svg, r = 8, fill = K.live) => { const c = s("circle", {class: "pk", r, cx: 0, cy: 0, fill, stroke: K.ground, "stroke-width": 2.5}); svg.append(c); return c; };


const SLIDE_L = [{opacity: 0, transform: "translateX(-40px)"}, {opacity: 1, transform: "none"}];
const SLIDE_R = [{opacity: 0, transform: "translateX(40px)"}, {opacity: 1, transform: "none"}];
function drawArrow(a, dur = 800) { draw(a.p, dur); a.hd.style.opacity = 0; at(dur, () => show(a.hd, FADE, 200)); }
function dim(el, to = .25) { el.style.opacity = to; }
function frameCh(idx, C, svg) {
  const chips = IN.meta.showChapters === false ? null : h("div", {class: "chapters"}, IN.meta.chapters.map((c, i) => h("span", {class: i === idx ? "now" : ""}, `${i + 1} ${c}`)));
  return h("section", {class: "slide"}, h("div", {}, h("p", {class: "kick"}, C.kick), h("h2", {}, C.title), chips),
    h("div", {class: "art"}, svg), h("i", {class: "prog"}));
}

/* a text panel whose lines are swapped per step */
function textPanel(svg, x, y, w, hgt) {
  const g = grp(rect(x, y, w, hgt, 18));
  const kick = tx({x: x + 30, y: y + 46, class: "x-pk-k"}, "");
  const ls = [0, 1, 2].map((i) => tx({x: x + 30, y: y + 92 + i * 34, class: "x-pline"}, ""));
  g.append(kick, ...ls); svg.append(g);
  return {g, set(p) {
    kick.textContent = p.kick; ls.forEach((l, i) => l.textContent = p.lines[i] || "");
    const body = [kick, ...ls];
    body.forEach((b, i) => { b.style.opacity = ""; play(b, RISE, {duration: 500, delay: i * 90, easing: EASE}); });
  }};
}



const DROP = [{opacity: 0, transform: "translateY(-70px)"}, {opacity: 1, transform: "translateY(6px)", offset: .75}, {opacity: 1, transform: "none"}];
const OWN = {jaime: {stroke: "#a78bfa", fill: "rgba(167,139,250,.14)"}, us: {stroke: "#3987e5", fill: "rgba(57,135,229,.16)"}, vendor: {stroke: "#f0b429", fill: "rgba(240,180,41,.12)"}, ext: {stroke: "#b3bec9", fill: "#19222c"}};
function block(x, y, w, hh, owner, icon, label, sub) {
  const o = OWN[owner];
  const g = grp(s("rect", {x, y, width: w, height: hh, rx: 12, fill: o.fill, stroke: o.stroke, "stroke-width": 2.4}),
    ico(icon, x + 20, y + hh / 2 - 15, 30, o.stroke),
    tx({x: x + 64, y: y + hh / 2 + (sub ? -2 : 6), style: "font:700 19px var(--f-body);fill:#edf2f7"}, label));
  if (sub) g.append(tx({x: x + 64, y: y + hh / 2 + 20, style: "font:400 14px var(--f-body);fill:#b3bec9"}, sub));
  return g;
}

const HALO = "paint-order:stroke;stroke:#0a0e13;stroke-width:8px;stroke-linejoin:round";

/* each slide block sets ID; ORDER at the bottom picks which slides show, and in what order */
let ID = "";
const _add = addSlide;
addSlide = (o) => { _add(o); SLIDES[SLIDES.length - 1].id = ID; };

/* small helpers on top of the kit */
const t = (x, y, str, style) => tx({x, y, style}, str);
function fadeTo(el, to, dur = 600) {
  const from = el.style.opacity === "" ? 1 : +el.style.opacity;
  el.style.opacity = to;
  play(el, [{opacity: from}, {opacity: to}], {duration: dur, easing: EASE});
}
function countTo(el, from, to, dur, fmt = (v) => `${Math.round(v)}%`) {
  const N = 18;
  for (let i = 1; i <= N; i++) at(dur * i / N, () => { el.textContent = fmt(from + (to - from) * i / N); });
}
function grow(el, axis, dur = 1200, origin) {
  el.style.transformOrigin = origin || (axis === "x" ? "0 50%" : "50% 100%");
  show(el, [{opacity: 1, transform: `scale${axis.toUpperCase()}(0)`}, {opacity: 1, transform: "none"}], dur);
}
function pill(cx, cy, label, color, w, fill = K.surface2, hh = 44, size = 19) {
  w = w || label.length * size * .52 + 44;
  return grp(s("rect", {x: cx - w / 2, y: cy - hh / 2, width: w, height: hh, rx: hh / 2, fill, stroke: color, "stroke-width": 2}),
    t(cx, cy + 1, label, `font:700 ${size}px var(--f-body);fill:#edf2f7;text-anchor:middle;dominant-baseline:central`));
}
function badge(cx, cy, label, owner, w) {
  const o = {us: [BLUE, "rgba(57,135,229,.16)"], vendor: [GOLD, "rgba(240,180,41,.13)"], bad: [RED, "rgba(229,83,75,.14)"]}[owner];
  return pill(cx, cy, label, o[0], w, o[1], 50, 21);
}
/* seeded random so the soil speckles are the same every time */
let SEED = 7;
const rnd = () => ((SEED = (SEED * 16807) % 2147483647) / 2147483647);

function sprout(x, base, k = 1, color = GREEN) {
  const p = (d) => s("path", {d, fill: color});
  return s("g", {}, s("path", {d: `M${x},${base} V${base - 26 * k}`, stroke: color, "stroke-width": 3 * k, "stroke-linecap": "round"}),
    p(`M${x},${base - 14 * k} c${-12 * k},0 ${-19 * k},${-8 * k} ${-19 * k},${-17 * k} c${11 * k},0 ${19 * k},${6 * k} ${19 * k},${17 * k} z`),
    p(`M${x},${base - 20 * k} c${12 * k},0 ${19 * k},${-8 * k} ${19 * k},${-16 * k} c${-11 * k},0 ${-19 * k},${6 * k} ${-19 * k},${16 * k} z`));
}

/* a clear storage tote of soil with a moisture probe, a temperature probe and a pump in a cup.
   Returns the pieces the slides animate: wet (soil darkening), tubeFlow + stream (water), drips (runoff). */
function tote(x, y, w, hh, o = {}) {
  const top = y + 12, bot = y + hh, ys = y + hh * (o.soilTop || .42), inset = 16;
  const xl = (yy) => x + inset * (yy - top) / (bot - top), xr = (yy) => x + w - inset * (yy - top) / (bot - top);
  const g = s("g", {});
  const body = s("path", {d: `M${x},${top} L${x + w},${top} L${x + w - inset},${bot} L${x + inset},${bot} Z`, fill: "rgba(237,242,247,.04)", stroke: "rgba(237,242,247,.4)", "stroke-width": 2, "stroke-linejoin": "round"});
  const soilD = `M${xl(ys) + 3},${ys} L${xr(ys) - 3},${ys} L${x + w - inset - 3},${bot - 3} L${x + inset + 3},${bot - 3} Z`;
  const soil = s("path", {d: soilD, fill: SOIL});
  const wet = s("path", {d: soilD, fill: SOIL_WET});
  wet.style.opacity = 0;
  const specks = s("g", {});
  for (let i = 0; i < Math.round(w * (bot - ys) / 520); i++) {
    const yy = ys + 6 + rnd() * (bot - ys - 12), xx = xl(yy) + 8 + rnd() * (xr(yy) - xl(yy) - 16);
    specks.append(s("circle", {cx: xx.toFixed(1), cy: yy.toFixed(1), r: (1 + rnd() * 1.8).toFixed(1), fill: rnd() > .5 ? "#735a42" : "#3b2c1f"}));
  }
  const rim = s("rect", {x: x - 8, y, width: w + 16, height: 13, rx: 6.5, fill: K.surface2, stroke: "rgba(237,242,247,.4)", "stroke-width": 1.6});
  const k = o.k || 1;
  const plants = s("g", {}, sprout(x + w * .42, ys + 2, 1.15 * k), sprout(x + w * .54, ys + 2, .85 * k));
  /* probes: flat capacitive blade + thin steel temperature rod */
  const px = x + w * .7, px2 = x + w * .84;
  const probe = s("g", {},
    s("rect", {x: px - 8 * k, y: ys - 46 * k, width: 16 * k, height: 100 * k, rx: 3, fill: "#1b2733", stroke: K.ink2, "stroke-width": 1.8}),
    s("rect", {x: px - 4 * k, y: ys - 40 * k, width: 8 * k, height: 12 * k, rx: 1.5, fill: K.axis}),
    s("path", {d: `M${px2},${ys - 40 * k} V${ys + 72 * k}`, stroke: "#9aa6b2", "stroke-width": 5 * k, "stroke-linecap": "round"}),
    s("rect", {x: px2 - 6 * k, y: ys - 52 * k, width: 12 * k, height: 16 * k, rx: 3, fill: K.surface2, stroke: K.ink2, "stroke-width": 1.6}));
  /* pump sits in a cup to the left; its tube climbs over the rim and drips in */
  const cx = x - 46 * k, cy = bot - 30 * k, nx = x + w * .2;
  const cup = s("g", {},
    s("path", {d: `M${cx - 22 * k},${cy - 26 * k} L${cx + 22 * k},${cy - 26 * k} L${cx + 17 * k},${cy + 26 * k} L${cx - 17 * k},${cy + 26 * k} Z`, fill: "rgba(237,242,247,.05)", stroke: "rgba(237,242,247,.45)", "stroke-width": 2, "stroke-linejoin": "round"}),
    s("path", {d: `M${cx - 20 * k},${cy - 12 * k} L${cx + 20 * k},${cy - 12 * k} L${cx + 17 * k},${cy + 24 * k} L${cx - 17 * k},${cy + 24 * k} Z`, fill: "rgba(217,89,38,.28)"}),
    s("rect", {x: cx - 9 * k, y: cy + 4 * k, width: 18 * k, height: 16 * k, rx: 3, fill: K.surface2, stroke: K.ink2, "stroke-width": 1.4}));
  const tubeD = `M${cx},${cy + 4 * k} V${y - 8} Q${cx},${y - 24} ${cx + 16},${y - 24} H${nx - 16} Q${nx},${y - 24} ${nx},${y - 8} V${y + 14}`;
  const tube = s("path", {d: tubeD, fill: "none", stroke: "#5b6874", "stroke-width": 6, "stroke-linecap": "round", "stroke-linejoin": "round"});
  const tubeFlow = s("path", {d: tubeD, fill: "none", stroke: ORANGE, "stroke-width": 4, "stroke-linecap": "round", "stroke-linejoin": "round"});
  const stream = s("path", {d: `M${nx},${y + 16} V${ys + 2}`, stroke: ORANGE, "stroke-width": 6 * k, "stroke-linecap": "round"});
  const splash = s("ellipse", {cx: nx, cy: ys + 2, rx: 26 * k, ry: 5 * k, fill: "rgba(217,89,38,.45)"});
  const drips = [0, 1, 2].map((i) => s("circle", {cx: x + w * (.3 + i * .2), cy: bot + 12, r: 5, fill: ORANGE}));
  [tubeFlow, stream, splash, ...drips].forEach((e) => e.style.opacity = 0);
  g.append(soil, wet, specks, plants, body, probe, rim, cup, tube, tubeFlow, stream, splash, ...drips);
  return {g, wet, tubeFlow, stream, splash, drips, ys, bot, px, px2, cx, cy, nx, probeTop: [px, ys - 46 * k], tempTop: [px2, ys - 52 * k],
    reset() { [wet, tubeFlow, stream, splash, ...drips].forEach((e) => e.style.opacity = 0); }};
}
/* the pump runs: water climbs the tube, falls into the soil, the soil darkens */
function pumpRun(T, wetTo = .6, dur = 700) {
  draw(T.tubeFlow, dur);
  at(dur, () => { draw(T.stream, 350); show(T.splash, FADE, 300); fadeTo(T.wet, wetTo, 1200); });
  at(dur + 1300, () => { [T.tubeFlow, T.stream, T.splash].forEach((e) => fadeTo(e, 0, 400)); });
}
/* water that the soil can't hold drips out the bottom */
function runoff(T, delay = 900) {
  T.drips.forEach((d, i) => at(delay + i * 180, () => {
    d.style.opacity = "";
    play(d, [{opacity: 0, transform: "translateY(-8px)"}, {opacity: 1, transform: "translateY(10px)"}, {opacity: 0, transform: "translateY(34px)"}], {duration: 900, easing: "ease-in"});
    at(900, () => { d.style.opacity = 0; });
  }));
}
function boxLabel(x, y, name, color, sub) {
  const e = s("text", {x, y, style: `font:700 23px var(--f-body);fill:${color}`});
  const a = s("tspan", {}); a.textContent = name; e.append(a);
  if (sub) { const b = s("tspan", {dx: 12, style: "font:400 18px var(--f-body);fill:#8c98a5"}); b.textContent = sub; e.append(b); }
  return e;
}
/* a moisture readout under a box: drop icon + number */
function readout(cx, cy, val) {
  const num = t(cx + 16, cy + 1, `${val}%`, "font:700 24px var(--f-body);fill:#edf2f7;text-anchor:middle;dominant-baseline:central");
  const g = grp(s("rect", {x: cx - 70, y: cy - 23, width: 140, height: 46, rx: 23, fill: K.surface2, stroke: HAIR, "stroke-width": 1.5}),
    ico("drop", cx - 52, cy - 12, 24, ORANGE), num);
  return {g, num, set(v) { num.textContent = `${v}%`; }};
}
const quiet = (x, y, str, anchor = "middle", size = 16) => t(x, y, str, `font:400 ${size}px var(--f-body);fill:#8c98a5;text-anchor:${anchor}`);

/* ================= running order =================
   Main pitch first, then backups for judge questions. Anything not listed is left out. */
const ORDER = ["title", "news", "hook", "drought2", "how2", "results", "season", "cost2", "sponsors", "map",
  /* backups */ "cup", "how", "laya", "crops", "fieldcrops", "drought", "safety", "layamoves", "croplines", "sources", "newssources"];
{
  const keep = ORDER.map((id) => SLIDES.find((sl) => sl.id === id)).filter(Boolean);
  SLIDES.length = 0; SLIDES.push(...keep);
}

/* ---------- navigation: click or → = next step, ← = back one step ---------- */
const stage = $("#stage"), dotsNav = $("#dots"), count = $("#count");
SLIDES.forEach((sl, i) => {
  stage.append(sl.el);
  const b = h("button", {type: "button", "aria-label": `Slide ${i + 1}`});
  b.addEventListener("click", (e) => { e.stopPropagation(); enter(i, 1, true); });
  dotsNav.append(b);
});
let cur = -1, stepNow = 0;
function render() {
  SLIDES.forEach((sl, i) => sl.el.classList.toggle("on", i === cur));
  [...dotsNav.children].forEach((d, k) => d.setAttribute("aria-current", k === cur ? "true" : "false"));
  const sl = SLIDES[cur];
  count.textContent = `slide ${cur + 1}/${SLIDES.length} · step ${stepNow}/${sl.n}`;
  $(".prog", sl.el).style.transform = `scaleX(${stepNow / sl.n})`;
  try { history.replaceState(null, "", location.pathname + location.search + `#s${cur + 1}-${stepNow}`); } catch (e) {}
}
/* open slide i showing steps 1..upTo; only the last of them animates, and only when moving forward */
function enter(i, upTo, animateLast) {
  flush();
  cur = Math.max(0, Math.min(SLIDES.length - 1, i));
  const sl = SLIDES[cur];
  upTo = Math.max(1, Math.min(sl.n, upTo));
  sl.reset();
  stepNow = upTo;
  render();
  for (let k = 0; k < upTo; k++) sl.step(k, !(animateLast && k === upTo - 1));
}
function next() {
  const sl = SLIDES[cur];
  if (stepNow < sl.n) { flush(); stepNow++; render(); sl.step(stepNow - 1, false); }
  else if (cur < SLIDES.length - 1) enter(cur + 1, 1, true);
}
function prev() {
  if (stepNow > 1) enter(cur, stepNow - 1, false);
  else if (cur > 0) enter(cur - 1, SLIDES[cur - 1].n, false);
}
function fit() { stage.style.transform = `scale(${Math.min(innerWidth / 1280, innerHeight / 720)})`; }
addEventListener("resize", fit); fit();
addEventListener("keydown", (e) => {
  if (["ArrowRight", " ", "PageDown", "Enter"].includes(e.key)) { e.preventDefault(); next(); }
  else if (["ArrowLeft", "PageUp", "Backspace"].includes(e.key)) { e.preventDefault(); prev(); }
  else if (e.key === "f" || e.key === "F") toggleFs();
});
$("#viewport").addEventListener("click", (e) => (e.clientX < innerWidth * .2 ? prev() : next()));
$("#replay").addEventListener("click", (e) => { e.stopPropagation(); enter(cur, 1, true); });
function toggleFs() { try { const p = document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.(); p?.catch?.(() => {}); } catch (e) {} }
$("#fsBtn").addEventListener("click", (e) => { e.stopPropagation(); toggleFs(); });
window.__deck = {next, prev, enter, state: () => ({slide: cur + 1, step: stepNow, steps: SLIDES[cur].n, slides: SLIDES.length})};
const m = location.hash.match(/^#s(\d+)(?:-(\d+))?/);
enter(m ? +m[1] - 1 : 0, m && m[2] ? +m[2] : 1, true);
</script>
